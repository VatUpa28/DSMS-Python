{% extends "base.html" %}
{% block content %}
<main class="container py-5">
  <div class="alert alert-danger shadow-sm" role="alert">
    <h1 class="h3">Request could not be completed</h1>
    <p>{{ message }}</p>
    {% if current_user %}
    <a class="btn btn-outline-dark" href="{{ url_for('inventory.inventory') }}">Return to Inventory</a>
    {% else %}
    <a class="btn btn-outline-dark" href="{{ url_for('auth.login') }}">Return to Sign In</a>
    {% endif %}
  </div>
</main>
{% endblock %}
