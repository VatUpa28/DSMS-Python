{% extends "base.html" %}
{% block content %}
<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Change password</h1>

          {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}

          <form method="POST" action="{{ url_for('auth.change_password') }}" data-disable-on-submit>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div class="mb-3">
              <label for="current_password" class="form-label">Current password</label>
              <input
                type="password"
                class="form-control"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="mb-3">
              <label for="new_password" class="form-label">New password</label>
              <input
                type="password"
                class="form-control"
                id="new_password"
                name="new_password"
                minlength="12"
                autocomplete="new-password"
                required
              />
              <div class="form-text">Use at least 12 characters.</div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label">Confirm new password</label>
              <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                minlength="12"
                autocomplete="new-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary">Change Password</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('inventory.inventory') }}">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
