{% extends "base.html" %}

{% block title %}Add User - DSMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3">Add User</h1>
                <p class="text-muted">Create a company account with a temporary password.</p>

                <form method="post" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="first_name">First name</label>
                            <input class="form-control" id="first_name" name="first_name"
                                   value="{{ values.first_name }}" required autocomplete="given-name">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="last_name">Last name</label>
                            <input class="form-control" id="last_name" name="last_name"
                                   value="{{ values.last_name }}" required autocomplete="family-name">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email"
                                   value="{{ values.email }}" required autocomplete="off">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="role">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                {% for role in role_options %}
                                    <option value="{{ role }}" {% if values.role == role %}selected{% endif %}>
                                        {{ role }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="password">Temporary password</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   required minlength="12" autocomplete="new-password">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="confirm_password">Confirm password</label>
                            <input class="form-control" id="confirm_password" name="confirm_password"
                                   type="password" required minlength="12" autocomplete="new-password">
                        </div>
                    </div>
                    <p class="form-text mt-3">
                        Passwords must be at least 12 characters. Share the temporary password securely.
                    </p>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">Create User</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('admin_users.user_list') }}">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
